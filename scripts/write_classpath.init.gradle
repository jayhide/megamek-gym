allprojects {
    afterEvaluate {
        if (tasks.findByName('runRLGameRunner')) {
            tasks.register('writeRLClasspath') {
                dependsOn 'jar'
                doLast {
                    def cp = sourceSets.main.runtimeClasspath.asPath
                    new File(projectDir, 'rl_classpath.txt').text = cp
                }
            }
        }
    }
}
