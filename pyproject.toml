[tool.poetry]
name = "megamek-gym"
version = "0.1.0"
description = "Gymnasium environment for MegaMek RL training"
authors = []
packages = [{include = "megamek_gym"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
gymnasium = ">=0.29"
numpy = ">=1.24"
pyyaml = ">=6.0"
torch = ">=2.0"
tensorboard = ">=2.14"
matplotlib = ">=3.7"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
scikit-learn = ">=1.5,<2"

[tool.poetry.plugins."gymnasium.envs"]
__root__ = "megamek_gym:register_envs"

[tool.poetry.plugins."pytest11"]
megamek-gym = "megamek_gym.pytest_plugin"

[tool.pytest.ini_options]
markers = [
    "integration: smoke tests requiring a live JVM (deselected by default)",
    "validation: sim-vs-Java cross-validation requiring a live JVM (deselected by default)",
]
addopts = "-m 'not integration and not validation'"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
